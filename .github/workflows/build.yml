name: Build

on:
  push:
    branches: "**"

permissions:
  checks: write

jobs:
  check-format-rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt -- --check
        uses: qRoC/cargo-actions@v1
        with:
          command: fmt
          args: -- --check
          token: ${{ secrets.GITHUB_TOKEN }}

  check-rust:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ubuntu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo check
        uses: qRoC/cargo-actions@v1
        with:
          command: check
          token: ${{ secrets.GITHUB_TOKEN }}

  check-rust-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo check
        uses: qRoC/cargo-actions@v1
        with:
          command: check
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-docker:
    needs: [check-format-rustfmt, check-rust, check-rust-light]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Docker tags
        id: tags
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE_TAG="ghcr.io/${REPO_OWNER}/recent-messages2"

          TAGS="${BASE_TAG}:${BRANCH_NAME}"

          # Add 'latest' tag for master branch
          if [ "$BRANCH_NAME" = "master" ]; then
            TAGS="${TAGS}\n${BASE_TAG}:latest"
          fi

          # Add version tag for v.* branches (remove 'v' prefix for cleaner tags)
          if [[ "$BRANCH_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION_TAG="${BRANCH_NAME#v}"
            TAGS="${TAGS}\n${BASE_TAG}:${VERSION_TAG}"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
